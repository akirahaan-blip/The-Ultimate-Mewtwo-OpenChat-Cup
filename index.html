<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>＼最強ミュウツーオプチャ杯／ スコア判定</title>
  <!-- ?v= はキャッシュ避け。JS/CSSを更新したらこの数字を上げること。
       これがないと、以前このページを開いた人のブラウザが古いファイルを掴んだままになる。 -->
  <link rel="stylesheet" href="style.css?v=18">
  <!-- Tesseract.js CDN (クライアントサイドOCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- 全体のフォント。M+1p の Heavy(800) と Bold(700) を読み込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;800&display=swap">
</head>
<body>

  <header>
    <div class="mascot-wrap">
      <!-- 左右のミュウ。合計800点以上で現れて交互に点滅する（左は絵を反転させている） -->
      <img src="mew.png" alt="" class="hibiscus-lamp" id="lampLeft">
      <img src="mewtwo.png" alt="ミュウツー" class="header-mascot">
      <img src="mew.png" alt="" class="hibiscus-lamp" id="lampRight">
    </div>
    <h1 class="flashy-title">＼最強ミュウツーオプチャ杯／</h1>
    <div class="subtitle">The Ultimate Mewtwo OpenChat Cup</div>
  </header>

  <!-- 特別ボーナス。スクショからは読み取れない項目なので、
       アップロードより先に入れてもらえるよう上に置いている。
       解析してもここのチェックは外れない。 -->
  <div class="bonus-card">
    <div class="bonus-card-head">✨ 特別ボーナス<span>先にチェックしてOK</span></div>
    <div class="chip-grid">
      <label class="chip-checkbox">
        <input type="checkbox" id="shinyCheck"> ★ 色違い (+350点)
      </label>
      <label class="chip-checkbox">
        <input type="checkbox" id="flCheck"> FL10以内 (+100点)
      </label>
    </div>
  </div>

  <!-- スクショ画像アップロード -->
  <section class="upload-card" id="uploadCard">
    <input type="file" id="fileInput" accept="image/*">
    <div class="upload-icon">📸</div>
    <div class="upload-text">スクショ画像をアップロード / ドロップ</div>
    <div class="upload-subtext">ステータス画面の写真から自動でスコアを判定します</div>
    
    <div class="ocr-progress" id="ocrProgress">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-label" id="progressLabel">解析中...</div>
    </div>
  </section>

  <!-- 自動読み取りの結果一覧（解析後に表示） -->
  <div class="ocr-summary" id="ocrSummary"></div>

  <!-- ============================================================
       スクショ用 結果カード (スクリーンショットに最適化)
       ============================================================ -->
  <main class="result-card" id="resultCard">
    <div class="result-header">
      <div class="pokemon-meta">
        <img src="mewtwo.png" alt="ミュウツー" class="card-mascot-icon">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span class="pokemon-badge" id="cardPokemonName">ミュウツー</span>
          <span class="sp-badge" id="cardSp">SP 443</span>
        </div>
      </div>
      <div class="score-main">
        <div class="score-title">Total Score</div>
        <div class="score-number-wrap">
          <span class="score-val" id="scoreVal">0</span>
          <span class="score-unit">pt</span>
        </div>
      </div>
    </div>

    <!-- 適用ボーナスタグ -->
    <div class="bonus-tags" id="bonusTags"></div>

    <!-- 内訳グリッド -->
    <div class="breakdown-grid" id="breakdownGrid"></div>

    <div class="card-footer">
      <span>The Ultimate Mewtwo OpenChat Cup</span>
      <span>公式スコア判定</span>
    </div>
  </main>

  <!-- X投稿用 -->
  <div class="btn-group">
    <button class="btn btn-share" id="shareImgBtn">🖼️ 画像を保存</button>
    <button class="btn btn-share" id="shareTxtBtn">📋 投稿文をコピー</button>
  </div>
  <textarea class="post-text" id="postText" readonly hidden></textarea>

  <!-- 操作ボタン -->
  <div class="btn-group">
    <button class="btn btn-primary" id="saveHistoryBtn">📥 記録を履歴に保存</button>
    <button class="btn btn-secondary" id="clearBtn">🔄 リセット</button>
  </div>

  <!-- ============================================================
       手動調整・完全選択式フォーム
       ============================================================ -->
  <h2 class="section-title">ステータス確認・手動調整</h2>

  <div class="form-group">
    <div class="form-row">
      <div class="form-col">
        <label for="spInput">SP</label>
        <input type="number" id="spInput" placeholder="443" min="0">
      </div>
    </div>

    <div class="form-row">
      <div class="form-col" style="flex: 2;">
        <label>食材構成 (Lv.1 / Lv.30 / Lv.60)</label>
        <div class="ing-preview-row" id="ingPreviewRow" style="display: flex; gap: 8px; margin-bottom: 6px;">
          <div class="ing-badge-item" id="ingBadge1"></div>
          <div class="ing-badge-item" id="ingBadge30"></div>
          <div class="ing-badge-item" id="ingBadge60"></div>
        </div>
        <!-- 3つの選択肢の中身は app.js が ingredients-setting.js を見て作る。
             食材を変えるとき、ここのHTMLを直さなくて済むようにするため。 -->
        <div style="display: flex; gap: 6px;">
          <select id="ingSlot1" style="flex: 1;" disabled></select>
          <select id="ingSlot30" style="flex: 1;"></select>
          <select id="ingSlot60" style="flex: 1;"></select>
        </div>
      </div>
      <div class="form-col">
        <label for="natureSelect">性格</label>
        <select id="natureSelect"></select>
      </div>
    </div>

  </div>

  <!-- サブスキル5枠 -->
  <h2 class="section-title">サブスキル（Lv10〜80）</h2>
  <div class="form-group" id="subSkillContainer"></div>

  <!-- 履歴 -->
  <h2 class="section-title">保存履歴</h2>
  <div class="form-group" id="historyList"></div>

  <script type="module" src="app.js?v=18"></script>
</body>
</html>
